<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校園跑班課 - QR Code 簽到掃描</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: '微軟正黑體', sans-serif; text-align: center; background: #f0f2f5; margin: 0; padding: 20px; }
        #reader { width: 100%; max-width: 500px; margin: 20px auto; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1); background: #fff; }
        #result-box { margin-top: 20px; padding: 15px; border-radius: 8px; font-weight: bold; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .loading { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        h2 { color: #004a8d; }
    </style>
</head>
<body>
    <h2>📸 學生簽到掃描器</h2>
    <div id="reader"></div>
    <div id="result-box" style="display:none;"></div>
    <p style="color: #666; font-size: 14px;">請將學生提供的 QR Code 對準攝影機中心</p>

    <script>
        // --- 核心配置 ---
        const GAS_WEB_APP_URL = ""; 

        const html5QrCode = new Html5Qrcode("reader");
        const resultBox = document.getElementById("result-box");

        // 顯示狀態訊息
        function updateStatus(msg, type) {
            resultBox.style.display = "block";
            resultBox.innerText = msg;
            resultBox.className = type;
        }

        // 掃描成功回呼
        const onScanSuccess = (decodedText) => {
            // 暫停掃描避免重複發送
            html5QrCode.pause(true);
            updateStatus("掃描成功，上傳資料中...", "loading");

            // 透過 POST 將資料傳給 GAS
            fetch(GAS_WEB_APP_URL, {
                method: "POST",
                mode: "no-cors", // 跨網域存取 GAS 必備
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ qrContent: decodedText })
            })
            .then(() => {
                updateStatus("✅ 簽到資料已成功傳回試算表！", "success");
                // 3秒後重新啟動掃描，等待下位同學
                setTimeout(() => {
                    resultBox.style.display = "none";
                    html5QrCode.resume();
                }, 3000);
            })
            .catch(err => {
                updateStatus("❌ 上傳失敗: " + err, "error");
                setTimeout(() => html5QrCode.resume(), 3000);
            });
        };

        // 啟動相機
        function startScanner() {
            html5QrCode.start(
                { facingMode: "environment" }, // 強制使用後置鏡頭
                { fps: 10, qrbox: { width: 250, height: 250 } },
                onScanSuccess
            ).catch(err => {
                updateStatus("無法開啟相機，請檢查權限：" + err, "error");
            });
        }

        startScanner();
    </script>
</body>
</html>
